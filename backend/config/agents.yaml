# Agent registry — Agent = Architecture × LLM × Config (BACKEND_ARCHITECTURE §8).
# Every agent inherits `defaults`; any key (including nested `options`) can be overridden per agent.
# Extra per-agent flag: `send_temperature: false` omits temperature for models that reject it.
# Model slugs were checked against OpenRouter `GET /models` (2026-09-30; D-034 set re-checked in phase 2b-2); `uv run python -m app.cli smoke-test` re-checks them.

defaults:
  temperature: 0.3
  reasoning_effort: low          # sent only if not null
  max_tokens: 4000
  output_mode: json_object       # json_schema | json_object | prompt_only
  prompt_version: v1
  options:
    max_questions: 12
    safety_floor: true
    emergency_threshold: 0.20

# D-035: USD per 1M tokens, one entry per model used by any agent (enabled or not). Snapshot of
# OpenRouter GET /models `pricing.prompt` / `pricing.completion` (USD per token) × 1,000,000.
# Only used for `estimated_cost_usd`; the reported `usage.cost` stays the source of truth.
# Extra price fields seen on /models (cache read/write, reasoning, long-context and time-of-day
# overrides) are not modeled — see B-042.
pricing:
  openai/gpt-5.4: { input_per_mtok: 2.5, output_per_mtok: 15.0, source: openrouter-models, as_of: "2026-09-30" }
