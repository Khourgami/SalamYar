# Agent registry — Agent = Architecture × LLM × Config (BACKEND_ARCHITECTURE §8).
# Every agent inherits `defaults`; any key (including nested `options`) can be overridden per agent.
# Extra per-agent flag: `send_temperature: false` omits temperature for models that reject it.
# Model slugs were checked against OpenRouter `GET /models` (2026-09-30; D-034 set re-checked in phase 2b-2); `uv run python -m app.cli smoke-test` re-checks them.

defaults:
  temperature: 0.3
  reasoning_effort: low          # sent only if not null
  max_tokens: 4000
  output_mode: json_object       # json_schema | json_object | prompt_only
  prompt_version: v1
  options:
    max_questions: 12
    safety_floor: true
    emergency_threshold: 0.20

agents:
