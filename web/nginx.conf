# Served from /etc/nginx/templates/default.conf.template.
# ${API_UPSTREAM} is substituted by the nginx image entrypoint (default http://backend:8000).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never let a stale SPA shell hide a fresh deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API traffic goes to the backend, with the /api/v1 prefix preserved.
    # The target is held in a variable so nginx resolves it per request instead of
    # refusing to boot when "backend" is not up yet (and resolving it again after a
    # redeploy). 127.0.0.11 is Docker's embedded DNS on a user-defined network.
    # Agent turns may take up to 90 s per the contract, so keep generous timeouts.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Vite emits content-hashed filenames for everything under /assets/.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
